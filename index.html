<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Pro - Inscription & Authentification</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --dark: #0f172a;
            --gray-light: #f8fafc;
            --text-main: #334155;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--gray-light); color: var(--text-main); display: flex; align-items: center; justify-content: center; height: 100vh; }
        .auth-container { max-width: 450px; width: 100%; background: white; padding: 40px 30px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 15px 35px rgba(0,0,0,0.05); }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; top: 50%; left: 16px; transform: translateY(-50%); color: #64748b; }
        .input-group input { width: 100%; padding: 14px 16px 14px 48px; background: var(--gray-light); border: 1px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; }
        .input-group input:focus { border-color: var(--primary); background: white; }
        .btn-primary { background: var(--primary); color: white; padding: 14px; border-radius: 12px; font-weight: 600; border: none; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn-primary:hover { background: var(--primary-dark); }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 style="margin-bottom: 20px; text-align: center; color: var(--dark);">Créer un Compte</h2>
        
        <form id="registerForm">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="regName" placeholder="Nom complet" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="regEmail" placeholder="Adresse e-mail" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" id="regPhone" placeholder="Numéro de téléphone" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="regPassword" placeholder="Mot de passe (6 caractères min)" required>
            </div>
            <button type="submit" class="btn-primary" id="regBtn">S'inscrire</button>
        </form>
    </div>

    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <script>
        const { Client, Account, Databases, ID } = Appwrite;
        const client = new Client()
            .setEndpoint('https://fra.cloud.appwrite.io/v1')
            .setProject('6abe94b500149981a9c2');

        const account = new Account(client);
        const databases = new Databases(client);

        const DATABASE_ID = '6abe955d003d5da5415b';
        const COLLECTION_ID = '6abe9d4b0031f85bf410'; // جدول users

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('regName',).value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const regBtn = document.getElementById('regBtn');

            regBtn.innerText = "Création en cours...";
            regBtn.disabled = true;

            try {
                // 1. إنشاء الحساب الآمن في نظام المصادقة (Auth) أولاً
                const newAccount = await account.create(ID.unique(), email, password, name);
                const userId = newAccount.$id; 

                // توليد بيانات التراخيص الافتراضية
                const initialKey = "LIFE-" + Math.random().toString(36).substring(2, 8).toUpperCase();
                const expiryDateObj = new Date();
                expiryDateObj.setFullYear(expiryDateObj.getFullYear() + 1);
                const expiryDateStr = expiryDateObj.toISOString().split('T')[0];

                const initialLicenses = JSON.stringify([{
                    key: initialKey,
                    purchase_date: new Date().toISOString().split('T')[0],
                    expiry_date: expiryDateStr,
                    status: 'Actif'
                }]);

                // 2. إرسال قيمة آمنة لخانة password في الجدول لإرضاء شرط الجدول (Required) مع حماية الخصوصية
                const userData = {
                    name: name,
                    email: email,
                    phone: phone,
                    password: "[SECURED_BY_AUTH]", // قيمة وهمية آمنة تتجاوز خطأ الجدول بينما الحماية الحقيقية تتم في Auth
                    activation_key: initialKey,
                    licenses: initialLicenses,
                    expiry_date: expiryDateStr
                };

                // حفظ المستند في الجدول باستخدام الـ userId كمعرف للوثيقة
                await databases.createDocument(DATABASE_ID, COLLECTION_ID, userId, userData);

                // 3. تسجيل الدخول تلقائياً والانتقال إلى لوحة التحكم
                await account.createEmailPasswordSession(email, password);

                alert("Inscription réussie ! Bienvenue sur POS Pro.");
                window.location.href = 'Dashboard.html';

            } catch (err) {
                console.error(err);
                alert("Erreur lors de l'inscription : " + (err.message || err));
            } finally {
                regBtn.innerText = "S'inscrire";
                regBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
