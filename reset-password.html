<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Pro - Réinitialisation du Mot de Passe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --dark: #0f172a;
            --gray-light: #f8fafc;
            --text-main: #334155;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--gray-light); color: var(--text-main); display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        .reset-card {
            background: white; padding: 40px 30px; border-radius: 20px;
            border: 1px solid var(--border); box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            width: 100%; max-width: 450px; text-align: center;
        }
        .reset-card h2 { color: var(--dark); margin-bottom: 10px; font-size: 22px; }
        .reset-card p { color: #64748b; font-size: 14px; margin-bottom: 25px; }

        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group i { position: absolute; top: 50%; left: 16px; transform: translateY(-50%); color: #64748b; }
        .input-group input {
            width: 100%; padding: 14px 16px 14px 48px; background: var(--gray-light);
            border: 1px solid var(--border); border-radius: 12px; font-size: 15px; outline: none;
        }
        .input-group input:focus { border-color: var(--primary); background: white; }

        .btn-primary {
            background: var(--primary); color: white; padding: 14px; border-radius: 12px;
            font-weight: 600; border: none; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s;
        }
        .btn-primary:hover { background: var(--primary-dark); }
    </style>
</head>
<body>

    <div class="reset-card">
        <h2>Réinitialisation du Mot de Passe</h2>
        <p>Veuillez entrer votre nouveau mot de passe pour mettre à jour votre compte.</p>
        
        <form id="resetForm">
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="newPassword" placeholder="Nouveau mot de passe" required>
            </div>
            <button type="submit" class="btn-primary" id="resetBtn">Enregistrer le nouveau mot de passe</button>
        </form>
    </div>

    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <script>
        const { Client, Databases } = Appwrite;
        const client = new Client()
            .setEndpoint('https://fra.cloud.appwrite.io/v1')
            .setProject('6abe94b500149981a9c2');

        const databases = new Databases(client);
        const DATABASE_ID = '6abe955d003d5da5415b';
        const COLLECTION_ID = '6abe9d4b0031f85bf410'; // جدول users

        // استخراج الـ userID (أو الـ document ID) من الرابط (URL parameters)
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value.trim();
            const resetBtn = document.getElementById('resetBtn');

            if (!userId) {
                alert("Erreur : ID utilisateur introuvable dans le lien.");
                return;
            }

            if (!newPassword || newPassword.length < 6) {
                alert("Le mot de passe doit contenir au moins 6 caractères.");
                return;
            }

            resetBtn.innerText = "Mise à jour...";
            resetBtn.disabled = true;

            try {
                // تحديث حقل كلمة المرور في جدول users باستخدام الـ userID المحدد
                await databases.updateDocument(
                    DATABASE_ID,
                    COLLECTION_ID,
                    userId,
                    {
                        password: newPassword
                    }
                );

                alert("Succès ! Votre mot de passe a été mis à jour avec succès.");
                window.location.href = 'index.html';
            } catch (err) {
                console.error(err);
                alert("Erreur lors de la mise à jour du mot de passe : " + (err.message || err));
            } finally {
                resetBtn.innerText = "Enregistrer le nouveau mot de passe";
                resetBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
